<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garimpeiro Multiavatar - Laboratório de Peças</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2=family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f4f6f9;
      color: #333;
      margin: 0;
      padding: 30px;
      text-align: center;
    }
    .container {
      max-width: 1300px;
      margin: 0 auto;
    }
    h1 {
      color: #3b368a;
      margin-bottom: 5px;
    }
    p {
      color: #666;
      margin-bottom: 25px;
    }
    .btn {
      background: #ff6b6b;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
      box-shadow: 0 4px 6px rgba(255, 107, 107, 0.2);
    }
    .btn:hover {
      background: #ee5b5b;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 20px;
      margin-top: 35px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.04);
      text-align: center;
      transition: transform 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
    }
    .card img {
      width: 90px;
      height: 90px;
      margin-bottom: 15px;
    }
    .code-label {
      font-size: 11px;
      color: #aaa;
      display: block;
      margin-bottom: 4px;
    }
    .code {
      display: block;
      font-family: monospace;
      background: #f0f0f5;
      color: #3b368a;
      padding: 6px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      border: 1px solid #e1e1e8;
      transition: all 0.2s;
    }
    .code:hover {
      background: #3b368a;
      color: white;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #2ecc71;
      color: white;
      padding: 12px 25px;
      border-radius: 8px;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Garimpeiro Multiavatar 🎯</h1>
    <p>Gere lotes de avatares com DNAs de 12 dígitos puros. Identifique os gêneros visuais e clique no código para copiar!</p>
    
    <button class="btn" onclick="gerarLoteGarimpo()">Gerar Novo Lote (60 Avatares)</button>
    
    <div id="gridGarimpo" class="grid"></div>
  </div>

  <div id="toast" class="toast">Código copiado!</div>

  <script src="https://cdn.jsdelivr.net/npm/@multiavatar/multiavatar/multiavatar.min.js"></script>
  
  <script>
    // Garante que cada parte tenha dois dígitos (adiciona o 0 na frente se for menor que 10)
    function formatarPar(num) {
      return String(num).padStart(2, '0');
    }

    // Fabricador de DNA: combina 6 números aleatórios entre 00 e 47
    function fabricarDnaAleatorio() {
      let dna = "";
      for (let i = 0; i < 6; i++) {
        let parteAleatoria = Math.floor(Math.random() * 48); // Escolhe de 0 a 47
        dna += formatarPar(parteAleatoria);
      }
      return dna;
    }

    // Função que desenha as cartas na tela
    function gerarLoteGarimpo() {
      const grid = document.getElementById('gridGarimpo');
      grid.innerHTML = "";
      let html = "";
      
      // Gera 60 opções por clique
      for (let i = 0; i < 60; i++) {
        const dna = fabricarDnaAleatorio();
        
        // Executa a biblioteca oficial para criar o SVG do DNA de 12 dígitos
        const svgCode = multiavatar(dna);
        const imagemUri = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svgCode)));
        
        html += `
          <div class="card">
            <img src="${imagemUri}" alt="Avatar">
            <span class="code-label">DNA COPIÁVEL</span>
            <span class="code" onclick="copiarDna('${dna}')" title="Clique para copiar o DNA">${dna}</span>
          </div>
        `;
      }
      
      grid.innerHTML = html;
    }

    // Copia o código numérico para a área de transferência do seu computador
    function copiarDna(codigo) {
      navigator.clipboard.writeText(codigo);
      
      const toast = document.getElementById('toast');
      toast.textContent = "Copiado: " + codigo;
      toast.classList.add('show');
      
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    // Já inicia o arquivo com o primeiro lote pronto
    gerarLoteGarimpo();
  </script>
</body>
</html>
