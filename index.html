<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat DF — Em Manutenção</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, #1a2a40 0%, #0c131f 60%, #06090f 100%);
      color: #f1f5f9;
      padding: 24px;
      overflow-x: hidden;
    }

    .maintenance-card {
      background: rgba(18, 26, 38, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 40px rgba(56, 189, 248, 0.08);
      backdrop-filter: blur(16px);
      border-radius: 28px;
      padding: 48px 36px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .logo-container {
      width: 140px;
      height: 140px;
      margin-bottom: 24px;
      border-radius: 24px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 0 20px rgba(56, 189, 248, 0.25);
    }

    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      font-size: 0.82rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 20px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 10px #38bdf8;
      animation: pulse 1.8s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    p {
      color: #94a3b8;
      font-size: 0.98rem;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .btn-refresh {
      background: #0284c7;
      color: #ffffff;
      border: none;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all 0.25s ease;
      box-shadow: 0 8px 20px rgba(2, 132, 199, 0.35);
    }

    .btn-refresh:hover {
      background: #0369a1;
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(2, 132, 199, 0.45);
    }

    .btn-refresh:active {
      transform: translateY(0);
    }

    .footer-copy {
      margin-top: 32px;
      font-size: 0.78rem;
      color: #64748b;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <main class="maintenance-card">
    <div class="logo-container">
      <!-- Caso a extensão seja diferente de .png, ajuste abaixo -->
      <img src="img/logo-chatdf.png" alt="Chat DF Logo" onerror="this.src='Gemini_Generated_Image_bc3umrbc3umrbc3u.jfif'">
    </div>

    <div class="status-badge">
      <span class="status-dot"></span>
      Em Manutenção
    </div>

    <h1>Em desenvolvimento e construção do chat DF</h1>

    <p>
      Estamos aplicando novidades e otimizações de performance para oferecer a melhor experiência de bate-papo do DF.
    </p>



    <div class="footer-copy">
      Chat DF &bull; Conectando pessoas no Distrito Federal
    </div>
  </main>

  <script>
    // Linha 170: Lógica simples do botão de recarregar a página
    document.getElementById('btnRefresh').addEventListener('click', () => {
      const btn = document.getElementById('btnRefresh');
      btn.style.opacity = '0.7';
      btn.innerText = 'Verificando...';
      
      setTimeout(() => {
        window.location.reload(true);
      }, 500);
    });
  </script>
</body>
</html>
